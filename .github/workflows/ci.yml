name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-serve.txt pytest
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jetway .
      - name: Container answers health and triage requests
        run: |
          docker run -d -p 8000:8000 --name jetway jetway
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/triage -H 'content-type: application/json' \
            -d '{"text":"@united my bag never arrived"}' | tee /dev/stderr | grep -q '"route"'
